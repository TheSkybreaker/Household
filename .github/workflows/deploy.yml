name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# The changes job reads the earlier runs of this workflow.
permissions:
  contents: read
  actions: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      shopping: ${{ steps.diff.outputs.shopping }}
      cash: ${{ steps.diff.outputs.cash }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The diff starts from the commit of the last successful deploy, so the changes of a failed or
      # cancelled run go out with the next push. A manual run, or a last deploy that git does not
      # know, deploys everything. A change to the shared package or the workspace rebuilds both apps.
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' || true)
          if [ "$GITHUB_EVENT_NAME" != push ] || [ -z "$deployed" ] || ! git cat-file -e "$deployed^{commit}" 2>/dev/null; then
            changed=$(printf 'backend/\napps/shopping/\napps/cash/\n')
          else
            changed=$(git diff --name-only "$deployed" "$GITHUB_SHA")
          fi
          workspace='^(packages/shared/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'
          has() { grep -qE "$1" <<<"$changed" && echo true || echo false; }
          echo "backend=$(has '^backend/')" >> "$GITHUB_OUTPUT"
          echo "shopping=$(has "^apps/shopping/|$workspace")" >> "$GITHUB_OUTPUT"
          echo "cash=$(has "^apps/cash/|$workspace")" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The commit becomes the version: `household --version` on the server tells what is live.
      - name: Test and build the binary
        working-directory: backend
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/pocketbase/pocketbase.Version=$GITHUB_SHA" -o household .

      - uses: ./.github/actions/ssh-deploy
        with:
          part: backend
          file: backend/household
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          user: ${{ secrets.DEPLOY_USER }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

  # The apps go out after the backend they call, and not at all when its deploy failed.
  shopping:
    needs: [changes, backend]
    if: ${{ !cancelled() && needs.changes.outputs.shopping == 'true' && (needs.backend.result == 'success' || needs.backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Test and build the Spesa
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "shopping..." --if-present test
          pnpm --filter shopping build
          tar -czf shopping.tar.gz -C apps/shopping/dist .

      - uses: ./.github/actions/ssh-deploy
        with:
          part: shopping
          file: shopping.tar.gz
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          user: ${{ secrets.DEPLOY_USER }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

  cash:
    needs: [changes, backend]
    if: ${{ !cancelled() && needs.changes.outputs.cash == 'true' && (needs.backend.result == 'success' || needs.backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Test and build Conti
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "cash..." --if-present test
          pnpm --filter cash build
          tar -czf cash.tar.gz -C apps/cash/dist .

      - uses: ./.github/actions/ssh-deploy
        with:
          part: cash
          file: cash.tar.gz
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          user: ${{ secrets.DEPLOY_USER }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
