name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      shopping: ${{ steps.diff.outputs.shopping }}
      cash: ${{ steps.diff.outputs.cash }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A manual run, or a push whose previous commit is unknown, deploys everything. A change to the
      # shared package or the workspace rebuilds both apps.
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(printf 'backend/\napps/shopping/\napps/cash/\n')
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi
          workspace='^(packages/shared/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'
          has() { grep -qE "$1" <<<"$changed" && echo true || echo false; }
          echo "backend=$(has '^backend/')" >> "$GITHUB_OUTPUT"
          echo "shopping=$(has "^apps/shopping/|$workspace")" >> "$GITHUB_OUTPUT"
          echo "cash=$(has "^apps/cash/|$workspace")" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The commit becomes the version: `household --version` on the server tells what is live.
      - name: Test and build the binary
        working-directory: backend
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/pocketbase/pocketbase.Version=$GITHUB_SHA" -o household .

      - uses: ./.github/actions/ssh-deploy
        with:
          part: backend
          file: backend/household
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          user: ${{ secrets.DEPLOY_USER }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

  shopping:
    needs: changes
    if: needs.changes.outputs.shopping == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Test and build the Spesa
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "shopping..." --if-present test
          pnpm --filter shopping build
          tar -czf shopping.tar.gz -C apps/shopping/dist .

      - uses: ./.github/actions/ssh-deploy
        with:
          part: shopping
          file: shopping.tar.gz
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          user: ${{ secrets.DEPLOY_USER }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

  cash:
    needs: changes
    if: needs.changes.outputs.cash == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Test and build Conti
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "cash..." --if-present test
          pnpm --filter cash build
          tar -czf cash.tar.gz -C apps/cash/dist .

      - uses: ./.github/actions/ssh-deploy
        with:
          part: cash
          file: cash.tar.gz
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          user: ${{ secrets.DEPLOY_USER }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
