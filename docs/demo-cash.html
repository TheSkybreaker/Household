<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Conti</title>
<meta name="theme-color" content="#36C49D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout: colonna unica da 480px come la Spesa; pannello menta con i versamenti del mese, poi divisione in buste, buste, risparmi e movimenti su carta */
:root{
  --bg:#ECF6F2; --paper:#FFFFFF; --ink:#0E3530; --ink-2:#4C6E67; --line:#D2E6DF; --grid:#E3EEEA;
  --panel:#36C49D; --panel-ink:#04281F;
  --accent-text:#0B7A62; --accent-soft:#D9F1E9;
  --btn:#0C7F66; --btn-ink:#FFFFFF;
  --in-soft:#E9E6FB; --in-text:#4F42B5;
  --e1:#14967A; --e2:#EB6834; --e3:#4A3AA7; --e4:#E87BA4; --e5:#2A78D6; --e6:#E34948;
  --pv:#1677C9; --pv-ink:#FFFFFF; --pl:#F7B500; --pl-ink:#3D2C00;
  --hl:#FFF0C2; --danger:#C23B34; --glass:rgba(255,255,255,.9); --ring:#0B7A62; --on-ink:#7FE0C4;
  --spesa:#3AA6E8; --spesa-ink:#06283F;
  --shadow:0 1px 0 rgba(14,53,48,.05), 0 10px 26px -16px rgba(14,53,48,.35);
  --font-d:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-b:"Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#061815; --paper:#0E2723; --ink:#E1F4EE; --ink-2:#8CB2A8; --line:#1B3C35; --grid:#16332D;
    --panel:#23A27F; --panel-ink:#03201A;
    --accent-text:#6FDDBE; --accent-soft:#113730;
    --btn:#34C7A0; --btn-ink:#03231B;
    --in-soft:#231F45; --in-text:#B9B1F5;
    --e1:#22A884; --e2:#D95926; --e3:#9085E9; --e4:#D55181; --e5:#3987E5; --e6:#E66767;
    --pv:#3AA6E8; --pv-ink:#04192A; --pl:#F7C23A; --pl-ink:#2B1F00;
    --hl:#3A3010; --danger:#FF8A80; --glass:rgba(14,39,35,.92); --ring:#6FDDBE; --on-ink:#0C7F66;
    --spesa:#2F95D4; --spesa-ink:#04192A;
    --shadow:0 1px 0 rgba(0,0,0,.25), 0 12px 28px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#061815; --paper:#0E2723; --ink:#E1F4EE; --ink-2:#8CB2A8; --line:#1B3C35; --grid:#16332D;
  --panel:#23A27F; --panel-ink:#03201A;
  --accent-text:#6FDDBE; --accent-soft:#113730;
  --btn:#34C7A0; --btn-ink:#03231B;
  --in-soft:#231F45; --in-text:#B9B1F5;
  --e1:#22A884; --e2:#D95926; --e3:#9085E9; --e4:#D55181; --e5:#3987E5; --e6:#E66767;
  --pv:#3AA6E8; --pv-ink:#04192A; --pl:#F7C23A; --pl-ink:#2B1F00;
  --hl:#3A3010; --danger:#FF8A80; --glass:rgba(14,39,35,.92); --ring:#6FDDBE; --on-ink:#0C7F66;
  --spesa:#2F95D4; --spesa-ink:#04192A;
  --shadow:0 1px 0 rgba(0,0,0,.25), 0 12px 28px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.no-scroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;padding-inline:18px;padding-block:0 190px;display:flex;flex-direction:column}

/* barra in alto */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand-mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--panel);color:var(--panel-ink)}
.brand-mark svg{width:22px;height:22px}
.top-actions{display:flex;align-items:center;gap:10px}
.demo-pill{font-size:14px;font-weight:700;padding:7px 13px;border-radius:999px;border:1.5px dashed var(--ink-2);color:var(--ink-2)}
.av-btn{border-radius:50%;display:grid}

/* avatar */
.av{display:inline-grid;place-items:center;border-radius:50%;font-family:var(--font-d);font-weight:800;line-height:1;flex:none}
.av-v{background:var(--pv);color:var(--pv-ink)}
.av-l{background:var(--pl);color:var(--pl-ink)}
.av.xs{width:20px;height:20px;font-size:11px}
.av.sm{width:30px;height:30px;font-size:14px}
.av.md{width:38px;height:38px;font-size:17px}
.av.xl{width:58px;height:58px;font-size:25px}

/* pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:15px;font-weight:700}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.ghost{border:1.5px solid var(--line);color:var(--ink)}
.btn.wide{width:100%}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--paper);box-shadow:var(--shadow)}
.icon-btn svg{width:22px;height:22px}
.icon-btn:disabled{opacity:.35;cursor:default;box-shadow:none}
.text-btn{font-weight:700;font-size:15px;color:var(--accent-text);padding:6px 2px}

/* mese */
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 14px}
.month-nav h1{margin:0;font-family:var(--font-d);font-weight:800;font-size:28px;letter-spacing:-.025em;text-align:center}
.month-nav h1 span{display:block;font-family:var(--font-b);font-weight:400;font-size:14px;color:var(--ink-2);letter-spacing:0}

/* pannello del mese */
.panel{background:var(--panel);color:var(--panel-ink);border-radius:28px;padding:20px 20px 16px}
.panel-label{margin:0 0 6px;font-weight:700;font-size:15px}
.hero{display:flex;align-items:baseline;font-family:var(--font-d);font-weight:800;font-size:clamp(60px,19vw,92px);line-height:.86;letter-spacing:-.055em;margin:0 0 0 -3px;font-variation-settings:"opsz" 96}
.hero small{font-size:.36em;font-weight:600;letter-spacing:-.02em;margin-left:4px}
.panel-sub{margin:8px 0 0;font-size:15px;font-weight:700}
.meter{height:10px;border-radius:10px;background:rgba(4,40,31,.16);margin:14px 0 0;overflow:hidden}
.meter i{display:block;height:100%;background:var(--panel-ink);border-radius:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.stats > div{background:rgba(4,40,31,.1);border-radius:16px;padding:10px 12px;min-width:0}
.stats span{display:block;font-size:13px;font-weight:700}
.stats b{display:block;font-family:var(--font-d);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats small{display:block;font-size:12.5px;font-weight:700;opacity:.85}
.people{list-style:none;margin:10px 0 0;padding:0}
.people li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid rgba(4,40,31,.16)}
.people b{display:block;font-size:16px;line-height:1.2}
.people .amt{font-size:14px}
.st{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap}
.st svg{width:15px;height:15px;stroke-width:2.8}
.st.done{background:rgba(4,40,31,.12)}
.st.wait{border:1.5px dashed var(--panel-ink)}
.st.go{background:var(--panel-ink);color:var(--panel);height:36px}

/* sezioni */
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 4px}
.sec-h h2{margin:0;font-family:var(--font-d);font-weight:600;font-size:20px;letter-spacing:-.01em}
.sec-sub{margin:0 2px 12px;font-size:14px;color:var(--ink-2)}
.card{background:var(--paper);border-radius:22px;box-shadow:var(--shadow)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}

/* divisione del mese */
.split{padding:18px 16px 8px}
.stack{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden}
.stack i{display:block;height:100%;min-width:3px}
.stack i.free{background:transparent;border:2px dashed var(--line);border-radius:0 6px 6px 0}
.split-l{list-style:none;margin:14px 0 0;padding:0}
.split-l li{display:grid;grid-template-columns:12px 1fr auto 42px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.split-l li:first-child{border-top:0}
.split-l .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split-l .a{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.split-l .p{color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.split-l .free-dot{border:2px dashed var(--ink-2);background:transparent;width:12px;height:12px}
.warn{display:flex;gap:8px;align-items:flex-start;margin:10px 0 6px;font-size:14px;font-weight:700;color:var(--danger)}
.warn svg{width:18px;height:18px;flex:none;margin-top:1px}

/* buste */
.envs{list-style:none;margin:0;padding:6px 0}
.envs li + li .env{border-top:1px solid var(--line)}
.env{width:100%;display:flex;flex-direction:column;gap:8px;padding:14px 16px;text-align:left}
.env:active{background:var(--accent-soft)}
.env-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.env-name{display:flex;align-items:center;gap:10px;min-width:0}
.env-name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.env-name small{display:block;font-size:13px;color:var(--ink-2)}
.env-val{text-align:right;flex:none}
.env-val b{display:block;font-family:var(--font-d);font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.env-val small{display:block;font-size:13px;color:var(--ink-2)}
.env-val .over{color:var(--danger);font-weight:700}
.track{position:relative;height:10px;border-radius:10px;background:var(--grid);overflow:hidden}
.track i{display:block;height:100%;border-radius:10px}
.env-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;font-size:13px;color:var(--ink-2)}
.kind{display:inline-block;font-size:12px;font-weight:700;color:var(--ink-2);border:1.5px solid var(--line);border-radius:999px;padding:0 8px;margin-left:2px;vertical-align:1px}

/* grafico risparmi */
.savings{padding:16px 12px 10px 8px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);margin:0 4px 8px 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.lkey{display:inline-block;width:14px;height:2px;border-radius:1px}
.lc{position:relative;height:190px;touch-action:pan-y}
.lc svg{display:block;width:100%;height:100%;overflow:visible}
.lc text{fill:var(--ink-2);font-size:12px;font-family:var(--font-b)}
.lc text.sel{fill:var(--ink);font-weight:700}
.tbl{margin:10px 4px 0 8px;font-size:14px}
.tbl summary{cursor:pointer;color:var(--accent-text);font-weight:700;width:max-content;padding:4px 0}
.tbl-wrap{overflow-x:auto;margin-top:8px}
.tbl table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-weight:700;color:var(--ink-2);font-size:13px}
.tip{position:fixed;z-index:25;pointer-events:none;transform:translate(-50%, calc(-100% - 12px));background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 12px 28px -12px rgba(0,0,0,.4);font-size:13px;min-width:190px}
.tip b{display:block;font-size:14px;margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:10px;justify-content:space-between}
.tip .tr span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.tip .tr strong{font-variant-numeric:tabular-nums}

/* movimenti */
.day-h{margin:18px 4px 8px;font-size:14px;font-weight:700;color:var(--ink-2)}
.mvs{list-style:none;margin:0;padding:0;background:var(--paper);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.mvs li + li .mv{border-top:1px solid var(--line)}
.mv{width:100%;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 14px;text-align:left}
.mv:active{background:var(--accent-soft)}
.mv.is-fresh{animation:fresh 1.6s ease}
@keyframes fresh{0%,55%{background:var(--hl)}100%{background:transparent}}
.mv-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--grid)}
.mv-ico.in{background:var(--in-soft);color:var(--in-text)}
.mv-ico svg{width:21px;height:21px}
.mv-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.mv-desc{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-meta{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2);min-width:0}
.mv-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mv-amt.in{color:var(--in-text)}
.empty{padding:22px 20px;border:2px dashed var(--line);border-radius:22px;text-align:center;color:var(--ink-2)}
.empty p{margin:0}

/* aggiungi */
.fab-wrap{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 18px calc(84px + env(safe-area-inset-bottom, 0px));pointer-events:none}
.fab-in{max-width:444px;margin:0 auto;display:flex;justify-content:flex-end}
.fab{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;height:58px;padding:0 24px 0 19px;border-radius:999px;background:var(--btn);color:var(--btn-ink);font-weight:700;box-shadow:0 12px 26px -10px rgba(12,127,102,.7)}
.fab svg{width:22px;height:22px;stroke-width:2.6}

/* navigazione in basso */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--paper);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom, 0px))}
.tabs-in{max-width:480px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:12.5px;font-weight:700;color:var(--ink-2);border-radius:14px}
.tab .ti{display:grid;place-items:center;width:58px;height:30px;border-radius:999px;transition:background .2s}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ti{background:var(--accent-soft);color:var(--accent-text)}
.page-h{margin:8px 2px 4px}
.page-h h1{margin:0;font-family:var(--font-d);font-weight:800;font-size:30px;letter-spacing:-.025em}
.page-h p{margin:4px 0 0;color:var(--ink-2);font-size:15px;max-width:44ch}
.page-h + .sec{margin-top:18px}
.form{padding:4px 16px 16px}
.form .sumline{bottom:calc(66px + env(safe-area-inset-bottom, 0px));margin:14px -16px 0;padding:12px 16px}

/* torta delle spese */
.pie{padding:14px 16px 8px}
.seg.mini{margin:0 0 6px}
.seg.mini button{height:36px;font-size:14px}
.pie-wrap{display:flex;justify-content:center;margin:8px 0 6px}
.pie-wrap svg{width:208px;max-width:100%;height:auto;display:block}
.pie-wrap path{cursor:pointer;transition:opacity .2s}
.pc1{fill:var(--ink-2);font-size:12.5px;font-family:var(--font-b)}
.pc2{fill:var(--ink);font-size:23px;font-weight:800;font-family:var(--font-d);letter-spacing:-.02em}
.pc3{fill:var(--ink-2);font-size:12.5px;font-family:var(--font-b)}
.pie-l{list-style:none;margin:6px 0 0;padding:0}
.pie-l button{width:100%;display:grid;grid-template-columns:12px 1fr auto 42px;gap:10px;align-items:center;padding:9px 2px;border-top:1px solid var(--line);font-size:15px;text-align:left;transition:opacity .2s}
.pie-l li:first-child button{border-top:0}
.pie-l.has-sel button[aria-pressed="false"]{opacity:.45}
.pie-l .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pie-l .a{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.pie-l .p{color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-block:40px 32px}
.login-mark{width:84px;height:84px;border-radius:26px;background:var(--panel);color:var(--panel-ink);display:grid;place-items:center;margin-bottom:22px}
.login-mark svg{width:48px;height:48px}
.login h1{font-family:var(--font-d);font-weight:800;font-size:clamp(58px,18vw,78px);letter-spacing:-.045em;line-height:.9;margin:0 0 12px}
.login-sub{font-size:18px;color:var(--ink-2);margin:0 0 28px;max-width:32ch}
.login .field input{background:var(--paper)}
.login-demo{margin-top:24px;padding-top:18px;border-top:1.5px dashed var(--line)}
.login-demo p{margin:0 0 10px;font-size:14px;color:var(--ink-2)}
.pair-btns{display:flex;gap:10px}
.pair-btns button{flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:15px;background:var(--paper);box-shadow:var(--shadow);font-weight:700;min-width:0}

/* banner push */
.banner{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(8px + env(safe-area-inset-top, 0px)) 10px 0;transform:translateY(-130%);transition:transform .45s cubic-bezier(.2,.9,.25,1.08);pointer-events:none}
.banner.is-on{transform:none}
.banner.is-on .banner-card{pointer-events:auto}
.banner-card{max-width:460px;width:100%;margin:0 auto;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:22px;text-align:left;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 16px 40px -14px rgba(4,40,31,.5);border:1px solid var(--line)}
.banner-ico{width:38px;height:38px;flex:none;border-radius:10px;background:var(--panel);color:var(--panel-ink);display:grid;place-items:center}
.banner-ico svg{width:22px;height:22px}
.banner-txt{flex:1;display:flex;flex-direction:column;min-width:0;font-size:15px;line-height:1.3}
.banner-app{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-bottom:1px}
.banner-txt > b{font-size:16px}

/* toast */
.toast{position:fixed;left:0;right:0;bottom:calc(158px + env(safe-area-inset-bottom, 0px));z-index:15;display:flex;justify-content:center;padding:0 18px;pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s}
.toast.is-on{opacity:1;transform:none}
.toast-pill{display:flex;align-items:center;gap:14px;max-width:444px;padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:700;box-shadow:0 12px 30px -10px rgba(0,0,0,.45)}
.toast.is-on .toast-pill{pointer-events:auto}

function leftovers(ym) { return activeIn(ym).filter(e => e.kind === 'spend').map(e => { const x = envMonth(e, ym); return { e, left: x.assigned + x.bonus + x.moved - x.spent }; }); }
const leftoverOf = ym => leftovers(ym).reduce((n, r) => n + r.left, 0);
const sweepIn = (e, ym) => (e.id === sweepTarget(ym) && isClosed(ym) ? leftoverOf(ym) : 0);
function saveBalance(e, ym) {
  let b = (S.opening && S.opening[e.id]) || 0;
  rangeTo(ym).forEach(m => { const x = envMonth(e, m); b += x.assigned + x.bonus + x.moved - x.spent + sweepIn(e, m); });
  return b;
}
function monthIn(ym) {
  const s = snap(ym); if (!s) return { expected: 0, paid: 0, bonus: 0 };
  const bonus = inMonth(ym).filter(x => x.kind === 'bonus').reduce((n, x) => n + x.amt, 0);
  return { expected: s.contrib.v + s.contrib.l, paid: (s.paid.v ? s.contrib.v : 0) + (s.paid.l ? s.contrib.l : 0), bonus };
}

/* torta delle spese */
function spendByEnv(months) {
  const set = new Set(months), out = {};
  S.mv.forEach(x => { if (x.kind === 'spend' && set.has(x.date.slice(0, 7))) out[x.env] = (out[x.env] || 0) + x.amt; });
  return out;
}
function arcPath(R, r, a0, a1) {
  const c = 104, pt = (rad, a) => (c + rad * Math.sin(a)).toFixed(2) + ' ' + (c - rad * Math.cos(a)).toFixed(2);
  if (a1 - a0 >= Math.PI * 2 - 1e-6) return arcPath(R, r, a0, a0 + Math.PI) + arcPath(R, r, a0 + Math.PI, a1);
  const lg = a1 - a0 > Math.PI ? 1 : 0;
  return `M${pt(R, a0)}A${R} ${R} 0 ${lg} 1 ${pt(R, a1)}L${pt(r, a1)}A${r} ${r} 0 ${lg} 0 ${pt(r, a0)}Z`;
}
function pieView(m) {
  const all = ui.pieRange === 'all', months = all ? rangeTo(curMonth()) : [m];
  const by = spendByEnv(months);
  const rows = S.envs.filter(e => by[e.id] > 0).map(e => ({ e, a: by[e.id] })).sort((x, y) => y.a - x.a);
  const tot = rows.reduce((n, r) => n + r.a, 0);
  const seg = `<div class="seg mini" role="radiogroup" aria-label="Periodo">
    <button type="button" role="radio" aria-checked="${!all}" data-pr="month">${esc(cap(monthName(m)))}</button>
    <button type="button" role="radio" aria-checked="${all}" data-pr="all">Da ${esc(monthName(S.start))} a oggi</button></div>`;
  const head = `<div class="sec-h"><h2>Spese per busta</h2></div>`;
  if (!tot) return `<section class="sec">${head}<div class="card pie">${seg}<div class="empty" style="margin-top:8px"><p>Nessuna spesa in questo periodo.</p></div></div></section>`;
  if (ui.pieSel && !rows.some(r => r.e.id === ui.pieSel)) ui.pieSel = null;
  let a = 0;
  const paths = rows.map(r => {
    const a0 = a, a1 = a + r.a / tot * Math.PI * 2; a = a1;
    const dim = ui.pieSel && ui.pieSel !== r.e.id;
    return `<path d="${arcPath(96, 60, a0, a1)}" fill="${color(r.e)}" stroke="var(--paper)" stroke-width="2" stroke-linejoin="round" opacity="${dim ? 0.28 : 1}" data-pie="${r.e.id}"><title>${esc(r.e.name)}: ${eur(r.a)}</title></path>`;
  }).join('');
  const sel = rows.find(r => r.e.id === ui.pieSel);
  const center = sel
    ? `<text x="104" y="86" text-anchor="middle" class="pc1">${esc(sel.e.name.length > 16 ? sel.e.name.slice(0, 15) + '…' : sel.e.name)}</text><text x="104" y="113" text-anchor="middle" class="pc2">${eurR(Math.round(sel.a / 100) * 100)}</text><text x="104" y="133" text-anchor="middle" class="pc3">${Math.round(sel.a / tot * 100)}% del totale</text>`
    : `<text x="104" y="92" text-anchor="middle" class="pc1">Spesi</text><text x="104" y="120" text-anchor="middle" class="pc2">${eurR(Math.round(tot / 100) * 100)}</text>`;
  const legend = rows.map(r => `<li><button type="button" data-pie="${r.e.id}" aria-pressed="${ui.pieSel === r.e.id}"><i class="dot" style="background:${color(r.e)}"></i><span class="n">${esc(r.e.name)}</span><span class="a">${eur(r.a)}</span><span class="p">${Math.round(r.a / tot * 100)}%</span></button></li>`).join('');
  const label = rows.map(r => `${r.e.name} ${eur(r.a)}, ${Math.round(r.a / tot * 100)}%`).join('; ');
  return `<section class="sec">${head}
    <p class="sec-sub">${eur(tot)} spesi${all ? ` da ${esc(monthName(S.start))} a oggi` : ` a ${esc(monthName(m))}`}. Tocca una fetta o una riga per i dettagli.</p>
    <div class="card pie">${seg}
      <div class="pie-wrap"><svg viewBox="0 0 208 208" role="img" aria-label="${esc(label)}">${paths}${center}</svg></div>

    </div></section>`;

function niceMax(v) {
  const steps = [50000, 100000, 200000, 500000, 1000000, 2000000];
  const step = steps.find(s => v / s <= 4) || steps[steps.length - 1];
  return { step, max: Math.max(step, Math.ceil(v / step) * step) };
}
let lcState = null;
function drawSavings() {
  const box = $('#lc'); if (!box) { lcState = null; return; }
  const saves = live().filter(e => e.kind === 'save'), months = rangeTo(curMonth());
  const W = Math.max(260, box.clientWidth), H = 190, P = { l: 48, r: 16, t: 10, b: 26 };
  const series = saves.map(e => ({ e, v: months.map(mm => saveBalance(e, mm)) }));
  const { step, max } = niceMax(Math.max(1, ...series.flatMap(s => s.v)));
  const n = months.length, X = i => P.l + (n === 1 ? 0 : i * (W - P.l - P.r) / (n - 1)), Y = v => P.t + (1 - v / max) * (H - P.t - P.b);
  let g = '';
  for (let v = 0; v <= max; v += step) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--${v === 0 ? 'line' : 'grid'})" stroke-width="1"/><text x="${P.l - 8}" y="${Y(v) + 4}" text-anchor="end">${groupInt(v / 100)}</text>`;
  const xl = months.map((mm, i) => `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" class="${mm === ui.month ? 'sel' : ''}">${esc(monthShort(mm))}</text>`).join('');
  const lines = series.map(s => `<path d="${s.v.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('')}" fill="none" stroke="${color(s.e)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  const si = Math.max(0, months.indexOf(ui.month));
  const dots = series.map(s => `<circle cx="${X(si)}" cy="${Y(s.v[si])}" r="4.5" fill="${color(s.e)}" stroke="var(--paper)" stroke-width="2"/>`).join('');
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}${xl}<line id="lcX" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" stroke="var(--ink-2)" stroke-width="1" visibility="hidden"/>${lines}<g id="lcDots">${dots}</g><rect x="${P.l - 10}" y="0" width="${W - P.l - P.r + 20}" height="${H - P.b}" fill="transparent" id="lcHit"/></svg>`;
  lcState = { X, Y, series, months, n, P, W };
}
function lcMove(ev) {
  if (!lcState) return;
  const box = $('#lc'), rc = box.getBoundingClientRect(), { X, Y, series, months, n, P, W } = lcState;
  const px = (ev.clientX - rc.left) * (W / rc.width);
  const i = Math.max(0, Math.min(n - 1, Math.round((px - P.l) / ((W - P.l - P.r) / Math.max(1, n - 1)))));
  const xl = $('#lcX'); xl.setAttribute('x1', X(i)); xl.setAttribute('x2', X(i)); xl.setAttribute('visibility', 'visible');
  $('#lcDots').innerHTML = series.map(s => `<circle cx="${X(i)}" cy="${Y(s.v[i])}" r="4.5" fill="${color(s.e)}" stroke="var(--paper)" stroke-width="2"/>`).join('');
  tipEl.textContent = '';
  const b = document.createElement('b'); b.textContent = cap(monthName(months[i])) + (months[i] === curMonth() ? ', finora' : ''); tipEl.appendChild(b);
  series.forEach(s => {
    const r = document.createElement('div'); r.className = 'tr';
    const l = document.createElement('span'); const k = document.createElement('i'); k.className = 'lkey'; k.style.background = color(s.e); l.append(k, document.createTextNode(s.e.name));
    const v = document.createElement('strong'); v.textContent = eur(s.v[i]);
    r.append(l, v); tipEl.appendChild(r);
  });
  const sx = rc.left + X(i) * (rc.width / W);
  tipEl.style.left = Math.min(window.innerWidth - 105, Math.max(105, sx)) + 'px';
  tipEl.style.top = (rc.top + 8) + 'px';
  tipEl.hidden = false;
}
function lcLeave() { hideTip(); if (lcState) drawSavings(); }
function hideTip() { tipEl.hidden = true; }
document.addEventListener('pointermove', e => { if (e.target.id === 'lcHit') lcMove(e); });
document.addEventListener('pointerdown', e => { if (e.target.id === 'lcHit') lcMove(e); });
document.addEventListener('pointerout', e => { if (e.target.id === 'lcHit') lcLeave(); });
window.addEventListener('scroll', () => { if (!tipEl.hidden) lcLeave(); }, { passive: true });
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(drawSavings, 120); });

function monthItems(m) {
  const s = snap(m), items = inMonth(m).slice();
  ['v', 'l'].forEach(u => { if (s.paid[u]) items.push({ id: `c-${m}-${u}`, kind: 'contrib', by: u, amt: s.contrib[u], date: s.paid[u], at: 0, desc: 'Quota di ' + monthName(m) }); });
  if (isClosed(m) && sweepEnv(m)) { const lo = leftoverOf(m); if (lo !== 0) items.push({ id: `s-${m}`, kind: 'sweep', amt: lo, date: lastDay(m), at: Number.MAX_SAFE_INTEGER, desc: (lo > 0 ? 'Avanzo di ' : 'Sforamento di ') + monthName(m) }); }
  return items.sort((a, b) => b.date.localeCompare(a.date) || b.at - a.at);
}
function mvRow(x) {

  if (nums.some(n => isNaN(n))) return '<span class="ko">Controlla gli importi: usa solo numeri, per esempio 150 o 12,50.</span>';
  const tot = r.contrib.v + r.contrib.l, asg = Object.values(r.alloc).reduce((n, v) => n + v, 0), d = tot - asg;
  return `Si salva da solo. Versate <b>${eurR(tot)}</b>, assegnati <b>${eurR(asg)}</b>. ${d === 0 ? '<span class="ok">Tutto assegnato.</span>' : d > 0 ? `<span class="ok">Da assegnare ${eurR(d)}.</span>` : `<span class="ko">Mancano ${eurR(-d)}.</span>`}`;
}
function refreshSplit() {
  const box = $('#splitBox'); if (box) box.outerHTML = splitView(curMonth());
  const sl = $('#sumline'); if (sl) sl.innerHTML = sumLine();
}
function saveField(el) {
  const id = el.id, raw = el.value.trim(), v = raw === '' ? 0 : parseAmount(raw);
  if (isNaN(v) || v > 10000000) { const sl = $('#sumline'); if (sl) sl.innerHTML = '<span class="ko">Non ho salvato: usa solo numeri, per esempio 300 o 12,50.</span>'; return; }
  const s = snap(curMonth());
  let label = null;
  if (id.startsWith('ct-')) {
    const u = id.slice(3);
    if (S.contrib[u] !== v) { S.contrib[u] = v; s.contrib[u] = v; label = `Quota ${u === S.me ? 'tua' : 'di ' + nameOf(u)}: ${eurR(v)} al mese`; }
  } else if (id.startsWith('al-')) {
    const e = envOf(id.slice(3));
    if (e && e.monthly !== v) { e.monthly = v; s.alloc[e.id] = v; label = `${e.name}: ${eurR(v)} al mese`; }
  } else if (id.startsWith('goal-')) {
    const e = envOf(id.slice(5));
    if (e && (e.goal || 0) !== v) { e.goal = v; label = v ? `Obiettivo di ${e.name}: ${eurR(v)}` : `${e.name} senza obiettivo`; }
  }
  el.value = v ? toInput(v) : (id.startsWith('goal-') ? '' : '0');
  if (!label) { refreshSplit(); return; }
  save(); refreshSplit(); toast(label);
}
function saveSettings() {
  const r = readSettings();
  if ([r.contrib.v, r.contrib.l, ...Object.values(r.alloc), ...Object.values(r.goals)].some(n => isNaN(n))) { $('#sumline').innerHTML = sumLine(); return; }
  S.contrib = r.contrib;
  live().forEach(e => { e.monthly = r.alloc[e.id]; if (e.kind === 'save') e.goal = r.goals[e.id] || 0; });
  if (ui.sweepTo && envOf(ui.sweepTo)) S.sweepTo = ui.sweepTo;
  const s = snap(curMonth());
  s.contrib = { ...S.contrib }; s.alloc = Object.fromEntries(live().map(e => [e.id, e.monthly])); s.sweepTo = S.sweepTo;
  ui.sweepTo = null; save(); ui.month = curMonth(); render(); toast('Divisione salvata');
}
function addEnv() {
  const inp = $('#newEnv'), name = (inp && inp.value.trim()) || '';
  if (!name) { inp.focus(); return; }
  if (live().length >= MAX_ENVS) return;
  const pending = readSettings();
  const used = new Set(live().map(e => e.slot)), slot = [1, 2, 3, 4, 5, 6].find(n => !used.has(n));
  const id = name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + uid().slice(0, 3);
  S.envs.push({ id, name: cap(name), note: '', kind: ui.newKind, monthly: 0, goal: 0, slot });
  if (!isNaN(pending.contrib.v)) S.contrib = pending.contrib;
  live().forEach(e => { if (!isNaN(pending.alloc[e.id]) && pending.alloc[e.id] != null) e.monthly = pending.alloc[e.id]; if (e.kind === 'save' && pending.goals[e.id] != null && !isNaN(pending.goals[e.id])) e.goal = pending.goals[e.id]; });
  save();
  render();
  const n = document.getElementById('al-' + id); if (n) { n.focus(); n.select(); }
}

function profileSheet() {
  const me = S.me, o = other();
  return `<div class="sh-head">${av(me, 'xl')}<div><h2>${esc(nameOf(me))}</h2><p>${esc(emailOf(me))}</p></div></div>
  <div class="setting">
    <div><b>Notifiche</b><span>Quando ${esc(nameOf(o))} versa la sua quota, aggiunge soldi o registra una spesa</span></div>
    <button type="button" class="switch" role="switch" aria-checked="${S.notif}" aria-label="Notifiche" data-act="toggleNotif"><i></i></button>
  </div>
  <div class="flabel">Le vostre app</div>
  <div class="apps"><a class="app-ico" href="${SPESA_URL}" target="_blank" rel="noopener" aria-label="Apri Spesa"><span class="tile">${I.basket}</span>Spesa</a></div>
  <div class="field-grid">
    <label class="field" style="margin-top:0">Il tuo nome<input id="nameMe" value="${esc(nameOf(me))}" maxlength="20"></label>
    <label class="field" style="margin-top:0">L'altra persona<input id="nameOther" value="${esc(nameOf(o))}" maxlength="20"></label>
  </div>
  <p class="hint">Lo stesso accesso vale per tutte e due le app; uscendo da una esci anche dall'altra. Qui le notifiche sono simulate e i dati restano in questo browser.</p>
  <button type="button" class="btn ghost wide" data-act="logout">Esci</button>`;
}
function demoSheet() {
  const o = other(), on = esc(nameOf(o)), s = snap(curMonth());
  return `<h2 class="sh-title">Prova la demo</h2>
  <p class="sh-sub">Fai finta di essere ${on}, dall'altro telefono.</p>
  <button type="button" class="demo-act" data-demo="pay"${s.paid[o] ? ' disabled' : ''}><b>${on} versa la sua quota</b><span>${s.paid[o] ? 'Già versata questo mese' : 'Arriva la notifica e la cassa si riempie'}</span></button>
  <button type="button" class="demo-act" data-demo="bonus"><b>${on} aggiunge un extra</b><span>250 € in una busta di risparmio</span></button>
  <button type="button" class="demo-act" data-demo="spend"><b>${on} registra una spesa</b><span>Dalla busta Spesa, con notifica</span></button>
  <button type="button" class="demo-act" data-demo="switch"><b>Usa l'app come ${on}</b><span>Stessa cassa, vista dal suo lato</span></button>
  <button type="button" class="demo-act subtle" data-demo="reset">Ripristina i dati della demo</button>`;
}
function demo(a) {
  const o = other(), cm = curMonth();
  if (a === 'switch') { S.me = o; save(); closeSheet(); toast(`Ora usi l'app come ${nameOf(S.me)}`); return; }
  if (a === 'reset') { const me = S.me, names = S.names, notif = S.notif; S = seed(); S.me = me; S.names = names; S.notif = notif; save(); ui.month = cm; closeSheet(); toast('Dati della demo ripristinati'); return; }
  closeSheet();
  setTimeout(() => {
    if (a === 'pay') {
      const s = snap(cm); if (s.paid[o]) return;
      s.paid[o] = today(); save(); if (ui.month === cm) ui.fresh = `c-${cm}-${o}`; render();
      notify(`${nameOf(o)} ha versato la sua quota`, `${eur(s.contrib[o])} per ${monthName(cm)}. Nella cassa ora ci sono ${eur(monthIn(cm).paid + monthIn(cm).bonus)}.`);
    } else if (a === 'bonus') {
      const e = live().find(x => x.kind === 'save') || live()[0]; if (!e) return;
      const x = { id: uid(), kind: 'bonus', amt: 25000, env: e.id, desc: 'Lavoro extra', by: o, date: today(), at: Date.now() };
      S.mv.push(x); save(); if (ui.month === cm) ui.fresh = x.id; render();
      notify(`${nameOf(o)} ha aggiunto 250,00 € a ${e.name}`, e.kind === 'save' ? `Ora ci sono ${eur(saveBalance(e, cm))}${e.goal ? ' su ' + eurR(e.goal) : ''}.` : 'Versamento extra.');
    } else if (a === 'spend') {
      const e = live().find(x => x.id === 'spesa') || live().find(x => x.kind === 'spend'); if (!e) return;
      const pool = [['Esselunga', 4230], ['Mercato', 2460], ['Lidl', 3790], ['Coop', 5120]], p = pool[Math.floor(Math.random() * pool.length)];
      const x = { id: uid(), kind: 'spend', amt: p[1], env: e.id, desc: p[0], by: o, date: today(), at: Date.now() };
      S.mv.push(x); save(); if (ui.month === cm) ui.fresh = x.id; render();
      const em = envMonth(e, cm), left = em.assigned + em.bonus + em.moved - em.spent;
      notify(`${nameOf(o)} ha speso ${eur(p[1])} da ${e.name}`, `${p[0]}. ${left >= 0 ? 'Restano ' + eur(left) + '.' : 'La busta è oltre di ' + eur(-left) + '.'}`);
    }
  }, 450);
}

/* eventi */
document.addEventListener('click', e => {
  if (e.target === backdropEl) { closeSheet(); return; }
  const t = e.target.closest('[data-act],[data-env],[data-mv],[data-f],[data-demo],[data-login],[data-banner],[data-tab],[data-pr],[data-pie],[data-dt]');
  if (!t) return;
  const d = t.dataset;
  if (d.login) { S.me = d.login; save(); render(); return; }
  if (d.tab) { if (ui.tab !== d.tab) { ui.tab = d.tab; ui.pieSel = null; render(); window.scrollTo(0, 0); } return; }
  if (d.dt) { ui.delTo = d.dt; refillSheet(delEnvSheet(ui.delEnv)); const b = sheetEl.querySelector(`[data-dt="${d.dt}"]`); if (b) b.focus({ preventScroll: true }); return; }
  if (d.pr) { ui.pieRange = d.pr; ui.pieSel = null; render(); return; }
  if (d.pie) { ui.pieSel = ui.pieSel === d.pie ? null : d.pie; render(); return; }
  if (d.banner) { bannerEl.classList.remove('is-on'); if (sheetEl.classList.contains('is-on')) closeSheet(); ui.month = curMonth(); ui.tab = 'mese'; render(); window.scrollTo(0, 0); return; }
  if (d.env && !d.act) { ui.open = d.env; openSheet(envSheet(d.env), 'Busta'); return; }
  if (d.mv) {
    const x = monthItems(ui.month).find(m => m.id === d.mv); if (!x) return;
    ui.open = x; openSheet(mvSheet(x), 'Dettaglio del movimento'); return;
  }
  if (d.demo) { if (!t.disabled) demo(d.demo); return; }
  if (d.f) {
    if (d.f === 'sweepTo' && envOf(d.v)) { S.sweepTo = d.v; snap(curMonth()).sweepTo = d.v; save(); toast(`L'avanzo di fine mese andrà in ${envOf(d.v).name}`); }
    if (d.f === 'newKind' || d.f === 'sweepTo') { ui[d.f] = d.v; document.querySelectorAll(`[data-f="${d.f}"]`).forEach(b => b.setAttribute('aria-checked', String(b.dataset.v === d.v))); return; }
    if (!ui.form) return;
    const f = ui.form;
    if (d.f === 'kind' && f.kind !== d.v) { f.err = ''; if (d.v === 'bonus' && (!f.env || envOf(f.env).kind !== 'save')) f.env = (live().find(x => x.kind === 'save') || {}).id || f.env; }
    f[d.f] = d.v;
    if (d.f === 'env') f.err = '';
    refillSheet(addSheet());
    const again = sheetEl.querySelector(`[data-f="${d.f}"][data-v="${d.v}"]`); if (again) again.focus({ preventScroll: true });
    return;
  }
  switch (d.act) {
    case 'prev': if (ui.month > S.start) { ui.month = addMonth(ui.month, -1); ui.pieSel = null; render(); } return;
    case 'next': if (ui.month < curMonth()) { ui.month = addMonth(ui.month, 1); ui.pieSel = null; render(); } return;
    case 'pay': { const s = snap(ui.month); s.paid[S.me] = ui.month === curMonth() ? today() : ui.month + '-01'; save(); ui.fresh = `c-${ui.month}-${S.me}`; render(); toast(`Quota segnata. ${nameOf(other())} riceve una notifica`); return; }
    case 'add': ui.form = newForm('spend'); openSheet(addSheet(), 'Nuovo movimento'); return;
    case 'envSpend': ui.form = newForm('spend', d.id); openSheet(addSheet(), 'Nuova spesa'); return;
    case 'envAdd': ui.form = newForm('bonus', d.id); openSheet(addSheet(), 'Versamento extra'); return;
    case 'linkSpesa': { const f = ui.form; f.desc = 'Spesa veloce'; f.env = live().some(x => x.id === 'spesa') ? 'spesa' : f.env; f.linked = true; f.err = ''; f.date = today(); refillSheet(addSheet()); const a = $('#fAmt'); if (a) a.focus(); return; }
    case 'save': saveForm(); return;
    case 'addEnv': addEnv(); return;
    case 'askDelEnv': ui.delEnv = d.id; ui.delTo = null; openSheet(delEnvSheet(d.id), 'Elimina busta'); return;
    case 'doDelEnv': doDelEnv(d.id); return;
    case 'demo': openSheet(demoSheet(), 'Prova la demo'); return;
    case 'profile': openSheet(profileSheet(), 'Profilo'); return;
    case 'toggleNotif': S.notif = !S.notif; t.setAttribute('aria-checked', String(S.notif)); save(); toast(S.notif ? 'Notifiche attivate' : 'Notifiche disattivate'); return;
    case 'logout': closeSheet(); S.me = null; ui.tab = 'mese'; save(); render(); window.scrollTo(0, 0); return;
    case 'delMv': {
      if (!ui.confirmDel) { ui.confirmDel = true; t.classList.add('is-armed'); t.textContent = 'Tocca di nuovo per confermare'; return; }
      const x = ui.open; if (!x) { closeSheet(); return; }
      if (x.kind === 'contrib') {
        const s = snap(x.date.slice(0, 7)) || snap(ui.month), prev = s.paid[x.by];
        s.paid[x.by] = null; save(); closeSheet();
        toast('Quota segnata come non versata', { label: 'Annulla', fn: () => { s.paid[x.by] = prev; save(); render(); } });
      } else {
        const idx = S.mv.findIndex(m => m.id === x.id); if (idx < 0) { closeSheet(); return; }
        const [y] = S.mv.splice(idx, 1); save(); closeSheet();
        toast(`${y.desc} eliminato`, { label: 'Annulla', fn: () => { S.mv.push(y); save(); render(); } });
      }
      return;
    }
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (ui.form && (id === 'fAmt' || id === 'fDesc' || id === 'fDate')) {
    const k = id === 'fAmt' ? 'amount' : id === 'fDesc' ? 'desc' : 'date';
    ui.form[k] = e.target.value;
    if (id !== 'fDesc') { const p = $('#fPrev'); if (p) p.innerHTML = previewText(ui.form); }
    if (id === 'fDesc' && ui.form.desc) { const lc = sheetEl.querySelector('.link-card'); if (lc) lc.remove(); }
    return;
  }
  if (/^(ct|al|goal)-/.test(id)) { const s = $('#sumline'); if (s) s.innerHTML = sumLine(); return; }
  if (id === 'nameMe' || id === 'nameOther') {
    const u = id === 'nameMe' ? S.me : other();
    S.names[u] = e.target.value.trim() || (u === 'v' ? 'Vittorio' : 'Lei');
    save();
  }
});
document.addEventListener('change', e => { if (/^(ct|al|goal)-/.test(e.target.id || '')) saveField(e.target); });
document.addEventListener('submit', e => { if (e.target.id === 'loginForm') { e.preventDefault(); S.me = 'v'; save(); render(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetEl.classList.contains('is-on')) closeSheet();
  if (e.key === 'Enter' && ui.form && (e.target.id === 'fAmt' || e.target.id === 'fDesc')) { e.preventDefault(); saveForm(); }
  if (e.key === 'Enter' && e.target.id === 'newEnv') { e.preventDefault(); addEnv(); }
  if (e.key === 'Enter' && /^(ct|al|goal)-/.test(e.target.id || '')) { e.preventDefault(); e.target.blur(); }
});

render();
})();
</script>

</body></html>
